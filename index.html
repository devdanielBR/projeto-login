<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,key" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"></div>
            <div id="formulario">
                <h1>Login</h1>
                <p>seja bem vindo (a) novamente. Faça login para acessar sua conta e poder fazer as configuraçoes no seu ambiente</p>
                <form action="login.php" method="post" autocomplete="on" ></form>

                <div class="campo">
                    <span class="material-symbols-outlined">
                    person
                    </span>
                    <input type="email" name="login" id="ilogin" placeholder="digite seu email" autocomplete="email" required>
                    <label for="ilogin" >login</label>
                    

                </div>

                <div class="campo">
                    <span class="material-symbols-outlined">
                    key</span>
                    <input type="password" name="senha" id="isenha" placeholder="digite sua senha" autocomplete="new-password" required> 
                    <label for="isenha">senha</label>
                </div>
                
                <input type="submit" value="enviar">
                <a href="esqueci a senha">esqueci a senha</a>

            </div>
        </section>
    </main>
</body>
</html>
